apiVersion: apps/v1
kind: Deployment
metadata:
  name: vois-app
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vois-app
  template:
    metadata:
      labels:
        app: vois-app
    spec:
      containers:
      - name: flask-app
        image: us-central1-docker.pkg.dev/terraform-gcp-506723/vois-repo/vois-app:latest
        ports:
        - containerPort: 5000
        resources:
         limits:
           cpu: "100m"
           memory: "128Mi"
         requests:
           cpu: "10m"
           memory: "64Mi"